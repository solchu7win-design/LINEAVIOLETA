<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WallyBet · Línea Violeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Anton&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#150707;
    --black-deep:#000000;
    --red-deep:#2a0a4f;
    --red-mid:#5a17a8;
    --red-bright:#9b2fe8;
    --red-hot:#c04dff;
    --silver:#c9ccd1;
    --silver-bright:#eef0f3;
    --white:#ffffff;
    --ink:#0a0a0a;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  html{ background:var(--bg); }

  body{
    background:var(--bg);
    font-family:'Manrope', sans-serif;
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    isolation:isolate;
  }

  /* ---------------- ANIMATED BACKGROUND ---------------- */
  .bg-fx{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
      radial-gradient(circle at 50% 100%, #200606 0%, var(--bg) 60%);
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    animation:drift 16s ease-in-out infinite;
  }
  .blob.b1{ width:280px; height:280px; background:var(--red-mid); top:-80px; left:-60px; animation-delay:0s; }
  .blob.b2{ width:240px; height:240px; background:var(--red-hot); top:120px; right:-90px; opacity:0.35; animation-delay:-5s; }
  .blob.b3{ width:260px; height:260px; background:var(--silver); bottom:60px; left:-100px; opacity:0.14; animation-delay:-9s; }
  .blob.b4{ width:220px; height:220px; background:var(--red-deep); bottom:-100px; right:-60px; animation-delay:-3s; }
  .blob.b5{ width:260px; height:260px; background:var(--red-hot); top:38%; left:-40px; opacity:0.22; animation-delay:-11s; }
  .blob.b6{ width:240px; height:240px; background:var(--silver); top:55%; right:-60px; opacity:0.16; animation-delay:-6s; }
  .blob.b7{ width:220px; height:220px; background:var(--red-mid); bottom:18%; left:30%; opacity:0.2; animation-delay:-13s; }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-25px) scale(1.12); }
  }

  /* Floating, twinkling particles scattered across the whole background */
  .particle{
    position:absolute;
    border-radius:50%;
    background:var(--red-hot);
    box-shadow:0 0 8px 2px var(--red-hot);
    opacity:0;
    animation-name:particleFloat;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .particle.white{ background:#fff; box-shadow:0 0 6px 2px rgba(255,255,255,0.85); }
  .particle.silver{ background:var(--silver); box-shadow:0 0 6px 2px rgba(201,204,209,0.8); }
  .particle.magenta{ background:#b84dff; box-shadow:0 0 7px 2px rgba(184,77,255,0.85); }
  .particle.rose{ background:#d9a8ff; box-shadow:0 0 6px 2px rgba(217,168,255,0.8); }
  .particle.deep{ background:var(--red-bright); box-shadow:0 0 7px 2px rgba(155,47,232,0.8); }

  @keyframes particleFloat{
    0%{ opacity:0; transform:translate(0,0) scale(0.6); }
    20%{ opacity:0.85; }
    50%{ opacity:0.4; transform:translate(var(--dx,14px), var(--dy,-26px)) scale(1); }
    80%{ opacity:0.85; }
    100%{ opacity:0; transform:translate(0,0) scale(0.6); }
  }

  /* ---------------- HERO / LOGO ---------------- */
  .hero{
    position:relative;
    padding:40px 20px 10px;
    text-align:center;
    overflow:visible;
  }

  .logo-img{
    width:100%;
    max-width:420px;
    height:auto;
    display:block;
    margin:0 auto;
    filter:drop-shadow(0 0 22px rgba(155,47,232,0.4));
  }

  /* ---------------- CTA SECTION ---------------- */
  .cta-section{
    padding:44px 20px 10px;
    text-align:center;
  }

  .cta-title{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:17px;
    line-height:1.4;
    margin-bottom:24px;
  }

  .cta-title .accent{
    background:linear-gradient(135deg, var(--red-hot), var(--silver-bright));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .wa-button{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
    background:linear-gradient(180deg, #ffffff, #f1f1f1);
    border-radius:16px;
    padding:20px 20px;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
    animation:floatBtn 5s ease-in-out infinite;
  }

  .wa-button:nth-child(1){ animation-delay:0s; }
  .wa-button:nth-child(2){ animation-delay:-1.6s; }
  .wa-button:nth-child(3){ animation-delay:-3.2s; }

  @keyframes floatBtn{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }

  .wa-button:active{ transform:scale(0.96); }

  .wa-button.glow-red{
    padding:22px 20px;
    border:2px solid transparent;
    background:
      linear-gradient(180deg, #ffffff, #fff2f2) padding-box,
      linear-gradient(135deg, #c98aff, var(--red-hot), #4a0a7a) border-box;
    box-shadow:0 14px 30px rgba(155,47,232,0.55), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .wa-button.glow-silver{
    padding:22px 20px;
    border:2px solid transparent;
    background:
      linear-gradient(180deg, #ffffff, #f4f4f6) padding-box,
      linear-gradient(135deg, #ffffff, var(--silver), #55585e) border-box;
    box-shadow:0 14px 30px rgba(180,184,192,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .wa-button::after{
    content:'';
    position:absolute;
    top:0; left:-120%;
    width:50%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.9), transparent);
    transform:skewX(-20deg);
    animation:btnShine 3.2s ease-in-out infinite;
  }

  .wa-button:nth-child(1)::after{ animation-delay:0.3s; }
  .wa-button:nth-child(2)::after{ animation-delay:1.6s; }
  .wa-button:nth-child(3)::after{ animation-delay:2.9s; }

  @keyframes btnShine{
    0%{ left:-120%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }

  .wa-icon-wrap{
    position:relative;
    width:46px;
    height:46px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wa-icon-wrap::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    opacity:0.35;
    animation:ringPulse 2.2s ease-out infinite;
  }

  .glow-red .wa-icon-wrap::before{ background:var(--red-hot); }
  .glow-silver .wa-icon-wrap::before{ background:var(--silver); }

  .wa-icon{
    position:relative;
    width:46px;
    height:46px;
    border-radius:50%;
    background:rgba(10,10,10,0.92);
    border:1.5px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
  }

  .wa-icon svg{ width:28px; height:28px; color:#ffffff; }

  .glow-red .wa-icon{
    border-color:#ff8a8a;
    background:radial-gradient(circle at 32% 28%, rgba(155,47,232,0.6), rgba(10,10,10,0.94));
    box-shadow:0 0 10px rgba(155,47,232,0.6);
  }

  .glow-silver .wa-icon{
    border-color:#e4e6ea;
    background:radial-gradient(circle at 32% 28%, rgba(201,204,209,0.55), rgba(10,10,10,0.94));
    box-shadow:0 0 10px rgba(201,204,209,0.5);
  }

  @keyframes ringPulse{
    0%{ transform:scale(0.9); opacity:0.5; }
    70%{ transform:scale(1.6); opacity:0; }
    100%{ transform:scale(1.6); opacity:0; }
  }

  .btn-text{ text-align:left; flex:1; }

  .btn-title{
    font-family:'Unbounded', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:0.3px;
    line-height:1.1;
  }

  .btn-sub{
    font-size:11.5px;
    color:#4a0a63;
    font-weight:700;
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px;
  }

  .glow-silver .btn-sub{ color:#4a4d52; }

  .btn-sub .live-dot{
    width:6px; height:6px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 6px #22c55e;
    animation:blink 1.4s ease-in-out infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  .btn-arrow{
    font-size:20px;
    color:#5a17a8;
    animation:arrowNudge 1.6s ease-in-out infinite;
  }

  .glow-silver .btn-arrow{ color:#6b6e73; }

  @keyframes arrowNudge{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(4px); }
  }

  /* ---------------- FOOTER ---------------- */
  .footer{
    text-align:center;
    padding:38px 24px 46px;
  }

  .footer-rule{
    width:60px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, var(--red-hot), var(--silver));
    margin:0 auto 16px;
  }

  .footer-badge{
    display:inline-flex;
    align-items:center;
    padding:14px 26px 9px;
    border-radius:16px;
    background:
      linear-gradient(160deg, rgba(15,8,8,0.95), rgba(5,5,5,0.95)) padding-box,
      linear-gradient(135deg, var(--silver), var(--red-hot), var(--red-deep)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 10px 28px rgba(155,47,232,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .footer-badge-text{
    position:relative;
    display:inline-block;
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:29px;
    line-height:1;
    letter-spacing:0.2px;
    text-transform:uppercase;
    transform:skewX(-6deg);
    white-space:nowrap;
  }

  .badge-stroke-layer{
    position:absolute;
    inset:0;
    filter:blur(0.6px);
    z-index:0;
  }

  .badge-fill-layer{
    position:relative;
    z-index:1;
  }

  .badge-stroke-layer .w{ color:transparent; -webkit-text-stroke:3px rgba(155,47,232,0.85); }

  .badge-fill-layer .w{
    color:#ffffff;
    text-shadow:
      0 0 6px rgba(155,47,232,0.85),
      0 0 16px rgba(120,10,10,0.6),
      0 0 28px rgba(120,10,10,0.35);
  }

  .footer-features{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:18px;
  }

  .footer-feature{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14.5px;
    font-weight:800;
    color:var(--white);
    letter-spacing:0.3px;
  }

  .footer-feature svg{
    width:15px;
    height:15px;
    flex-shrink:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
.logo-wrap{position:relative;width:100%;max-width:460px;margin:0 auto;}
.logo-wrap .logo-img{max-width:100%;filter:drop-shadow(0 0 18px rgba(192,77,255,0.35));}
.logo-wrap .orbit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
@media (prefers-reduced-motion:reduce){.orbit animateMotion,.orbit animate{display:none}}
</style>
</head>

  // Pegá acá la URL de tu Apps Script (termina en /exec)
  // ⚠️ Pegá acá la URL del NUEVO deploy de Code_linea_corta.gs (tiene que
  // ser una implementación separada de la de las 4 líneas originales)
  // ⚠️ Pegá acá la URL del NUEVO deploy de Code_linea_violeta.gs (tiene que
  // ser una implementación separada de las otras líneas)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUb3XZyno49RwyG9K3jgFZbJqDE6WFV-2H_VMw3wT-SlUDJYeyt1GmXS0w5sXD_F6rJw/exec";

  // Mismo orden que en Code_linea_corta.gs (LINES)
  const lines = [
    "5491125448190",
    "5491125448420",
    "5491165903202",
    "5491156584255",
    "5491125604292",
    "5491160135425"
  ];

  // Nombre de cada plataforma (se inserta en las variantes de mensaje)
  const platformNames = {
    ganamos: "GANAMOS",
    bet30:   "BET30",
    betvip:  "BET VIP"
  };

  // Variantes de mensaje: se elige una al azar en cada clic, para que no
  // todos los visitantes manden el mismo texto (evita que WhatsApp lo
  // marque como spam por repetición).
  const messageTemplates = [
    "Hola! Quiero cargar en {plataforma}",
    "Quiero un usuario en {plataforma}",
    "Me armás porfa un usuario en {plataforma}?",
    "Quiero jugar en {plataforma}, mi nombre es ",
    "Hola, vengo por {plataforma} 👋 ¿Me armás usuario?",
    "Buenas, quiero jugar en {plataforma}",
    "Me hacés un usuario en {plataforma}, dale?",
    "Hola, para cargar en {plataforma}",
    "Quiero probar en {plataforma}",
    "Hola, me pasás los datos para jugar en {plataforma}?"
  ];

  // Registro de visita (una vez por sesión del navegador) para estadísticas
  try {
    if (!sessionStorage.getItem('visitLogged')) {
      sessionStorage.setItem('visitLogged', '1');
      fetch(`${APPS_SCRIPT_URL}?action=visit`).catch(() => {});
    }
  } catch (e) { fetch(`${APPS_SCRIPT_URL}?action=visit`).catch(() => {}); }

  function pickMessage(key){
    const template = messageTemplates[Math.floor(Math.random() * messageTemplates.length)];
    return template.replace('{plataforma}', platformNames[key]);
  }

  // Contadores en memoria local — arrancan en 0 y se actualizan apenas
  // carga la página (sin bloquear nada) y de forma optimista en cada clic.
  // Las 6 líneas forman un único pool compartido: no importa si el
  // cliente entra por GANAMOS, BET30 HOST o BET VIP, siempre se elige la línea
  // con menos carga entre TODAS, así se reparte parejo.
  let localCounts = lines.map(() => 0);
  let countsReady = false;

  // Pide los contadores reales al backend. Se hace al cargar la página y
  // se repite cada 10 segundos y cada vez que la persona vuelve a la pestaña,
  // así una página abierta hace rato nunca decide con números viejos.
  function refreshCounts(){
    fetch(`${APPS_SCRIPT_URL}?action=counts`)
      .then(res => res.json())
      .then(data => {
        if (data.ok && Array.isArray(data.counts) && data.counts.length === lines.length) {
          localCounts = data.counts;
          countsReady = true;
        }
      })
      .catch(() => { /* seguimos con los contadores locales si falla */ });
  }
  refreshCounts();
  setInterval(refreshCounts, 10000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshCounts();
  });

  // Elige la línea con menos mensajes. Si hay empate (por ejemplo, justo
  // después de reiniciar los contadores, o cuando varias personas entran a
  // la vez y ven los mismos números) sortea entre las empatadas, en vez de
  // mandar a todos a la primera.
  function pickLineIndex(){
    const min = Math.min(...localCounts);
    const candidates = [];
    for (let i = 0; i < localCounts.length; i++){
      if (localCounts[i] === min) candidates.push(i);
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function buildLink(number, message){
    return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
  }

  function handleClick(event, key){
    event.preventDefault();

    // 1) Decisión instantánea, sin red — 0ms
    const idx = pickLineIndex();
    const number = lines[idx];
    const link = buildLink(number, pickMessage(key));

    // 2) Redirige ya mismo
    window.open(link, '_blank', 'noopener');

    // 3) Actualiza el contador local al toque, para que el próximo
    //    clic (aunque sea del mismo visitante o del otro botón)
    //    también balancee bien
    localCounts[idx] += 1;

    // 4) Avisa al backend en segundo plano, sin esperar respuesta
    //    ni bloquear al usuario. Si falla, no pasa nada grave.
    fetch(`${APPS_SCRIPT_URL}?action=increment&line=${idx}&btn=${encodeURIComponent(key)}`).catch(() => {});
  }

  document.getElementById('btn-ganamos').addEventListener('click', (e) => handleClick(e, 'ganamos'));
  document.getElementById('btn-bet30').addEventListener('click', (e) => handleClick(e, 'bet30'));
  document.getElementById('btn-betvip').addEventListener('click', (e) => handleClick(e, 'betvip'));
</script>
</body>
</html>
